<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 420" width="420" height="420" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Copper + Mocida (.crm)">
  <title>Copper + Mocida — .crm</title>
  <!-- .crm = Copper + Mocida. The Copper mark (a "C" inside a cog, matching
       editors/vscode/icons/crs-icon) occupies the top-left; the Mocida mark
       (two overlapping squares) sits in the bottom-right, fully inside the
       canvas. Reads as "the Copper icon, with Mocida". -->

  <!-- ===== Copper cog + C, scaled ~0.46, anchored top-left ===== -->
  <!-- cog centre (185,185) -> (140,140): translate = 140 - 185*0.46 = 54.9 -->
  <g transform="translate(54.9 54.9) scale(0.46)">
    <g fill="#3b6fd4">
      <g>
        <rect x="167" y="6" width="36" height="48" rx="8" transform="rotate(0 185 185)"/>
        <rect x="167" y="6" width="36" height="48" rx="8" transform="rotate(30 185 185)"/>
        <rect x="167" y="6" width="36" height="48" rx="8" transform="rotate(60 185 185)"/>
        <rect x="167" y="6" width="36" height="48" rx="8" transform="rotate(90 185 185)"/>
        <rect x="167" y="6" width="36" height="48" rx="8" transform="rotate(120 185 185)"/>
        <rect x="167" y="6" width="36" height="48" rx="8" transform="rotate(150 185 185)"/>
        <rect x="167" y="6" width="36" height="48" rx="8" transform="rotate(180 185 185)"/>
        <rect x="167" y="6" width="36" height="48" rx="8" transform="rotate(210 185 185)"/>
        <rect x="167" y="6" width="36" height="48" rx="8" transform="rotate(270 185 185)"/>
        <rect x="167" y="6" width="36" height="48" rx="8" transform="rotate(330 185 185)"/>
      </g>
      <path fill-rule="evenodd"
            d="M185 40 a145 145 0 1 0 0.1 0 Z
               M185 92 a93 93 0 1 1 -0.1 0 Z"/>
    </g>
    <path d="M185 96
             a89 89 0 1 0 0 178
             a89 89 0 0 0 77 -44
             l-46 -26
             a36 36 0 1 1 0 -38
             l46 -26
             a89 89 0 0 0 -77 -44 Z"
          fill="#3b6fd4"/>
  </g>

  <!-- ===== Mocida badge: two overlapping squares, bottom-right ===== -->
  <!-- Kept within [206,372] on both axes — a clear margin from the canvas
       edge so the red square never clips at any icon size. -->
  <rect x="206" y="206" width="120" height="120" rx="22" fill="#5271ff"/>
  <rect x="252" y="252" width="120" height="120" rx="22" fill="#ff3131"/>
</svg>
