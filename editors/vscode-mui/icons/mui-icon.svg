<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 420" width="420" height="420" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Mocida (.mui)">
  <title>Mocida — .mui</title>
  <!-- The real Mocida mark: two overlapping rounded squares (blue + red),
       copied from mocida/assets/logo.svg so .mui files carry the genuine
       Mocida brand. -->
  <defs>
    <filter id="m-glow" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="10" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect x="30"  y="30"  width="240" height="240" rx="32" fill="#5271ff" filter="url(#m-glow)" opacity="0.95"/>
  <rect x="150" y="150" width="240" height="240" rx="32" fill="#ff3131" filter="url(#m-glow)" opacity="0.95"/>
</svg>
