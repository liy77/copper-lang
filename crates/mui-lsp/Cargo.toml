[package]
name = "mui-lsp"
version = "0.0.1-pre-alpha"
edition = "2021"
description = "Language server for the MUI markup language (.mui / .crm)."

[[bin]]
name = "mui-lsp"
path = "src/main.rs"

[dependencies]
mui-syntax = { path = "../mui-syntax" }
copper-syntax = { path = "../copper-syntax" }
tower-lsp = "0.20"
tokio = { version = "1.47", features = ["macros", "rt-multi-thread", "io-std", "io-util"] }
serde_json = "1.0"
ropey = "1.6"
dashmap = "5"
once_cell = "1.21"
