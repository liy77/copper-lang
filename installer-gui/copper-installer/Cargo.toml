# Native host for the MUI Copper installer.
#
# It renders installer.mui through the MUI runtime (mui-runtime) — so the .mui
# is the single source of the UI/design — and supplies the parts the runtime
# can't: it links backend.rs, seeds the prerequisite signals, and on the
# `installing` phase runs the real install on a background thread, streaming the
# log back into the `log_text` signal. The empty [workspace] detaches this from
# any parent workspace.
[workspace]

[package]
name = "copper-installer"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "copper-installer"
path = "src/main.rs"

[dependencies]
mocida = { path = "C:/Users/hcsbr/Documents/mocida/mocida-rs/mocida" }
mui-runtime = { path = "C:/Users/hcsbr/Documents/mocida/mocida-rs/mui-runtime" }
mui-syntax = { path = "C:/Users/hcsbr/Documents/copper-lang/crates/mui-syntax" }

[target.'cfg(windows)'.build-dependencies]
# Embeds the .exe icon (Explorer/taskbar) AND an `asInvoker` manifest so
# Windows' installer-detection heuristic doesn't auto-elevate this exe just
# because its name contains "installer" (which made it demand UAC + become
# unkillable from a normal shell).
winresource = "0.1"

[profile.release]
opt-level = 2
