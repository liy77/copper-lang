[workspace]
members = [".", "crates/copper-syntax", "crates/copper-parser", "crates/copper-lsp", "crates/mui-syntax", "crates/mui-codegen", "crates/mui-lsp", "crates/alloy-vm"]
# `dist/rust` is the output dir for cforge-transpiled programs; it has its
# own Cargo.toml that must NOT be a workspace member. The installer-gui
# is its own self-contained Tauri app — also kept out.
exclude = ["dist", "installer-gui", "lson-src", "alloy-gui"]
resolver = "2"

[package]
name = "copper-cforge"
version = "0.1.0-beta.0"
edition = "2021"
build = "build.rs"
authors = ["Liy", "Copper Authors"]

[[bin]]
name = "cforge"
path = "src/main.rs"

[dependencies]
copper-syntax = { path = "crates/copper-syntax" }
copper-parser = { path = "crates/copper-parser" }
mui-syntax = { path = "crates/mui-syntax" }
mui-codegen = { path = "crates/mui-codegen" }
clap = "4.6.1"
colored = "3.1.1"
once_cell = "1.21.4"
regex = "1.12.3"
reqwest = "0.13.4"
serde = { version = "1.0.228", features = ["serde_derive"] }
serde_json = "1.0.150"
tokio = { version = "1.52.3", features = ["full"] }
toml = "1.1.2"
quick-xml = "0.40.1"
walkdir = "2.5.0"
